name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # The admin panel publishes validated content directly to these paths.
      # Do not start code CI (or send failure notifications) for content edits.
      - content/site-content.json
      - public/images/admin/**
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build
